name: PR 자동 검사

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 3.12 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: API 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: API 테스트 실행
        run: pytest tests

  aicc:
    name: AICC 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 3.12 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/aicc/requirements.txt

      - name: AICC 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r services/aicc/requirements.txt

      - name: AICC 테스트 실행
        env:
          PYTHONPATH: services/aicc
        run: pytest services/aicc/tests

  dashboard:
    name: Dashboard 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node.js 22 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: 대시보드 의존성 설치
        run: npm ci

      - name: 대시보드 코드 검사
        run: npm run lint

      - name: 대시보드 배포 빌드
        run: npm run build
