name: ai-s-eye

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_DB: ${POSTGRES_DB:-store}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-store} -d ${POSTGRES_DB:-store}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-AI's Eye API}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-store}:${POSTGRES_PASSWORD:-change-me-for-local-development}@db:5432/${POSTGRES_DB:-store}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SAMPLE_DATA_DIR: /workspace/samples
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./samples:/workspace/samples:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: ./apps/dashboard
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${DASHBOARD_BIND_HOST:-0.0.0.0}:${DASHBOARD_PORT:-5173}:5173"
    volumes:
      - ./apps/dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:5173
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  vision-replay:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    profiles:
      - demo
    command:
      - python
      - /workspace/services/vision-worker/replay_states.py
      - --file
      - /workspace/samples/cafe_stores_states.json
      - --api
      - http://api:8000
      - --interval
      - ${VISION_REPLAY_INTERVAL:-2}
      - --loop
    volumes:
      - ./services/vision-worker:/workspace/services/vision-worker:ro
      - ./samples:/workspace/samples:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  dashboard_node_modules:
